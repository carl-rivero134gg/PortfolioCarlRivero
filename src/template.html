<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carl Rivero | Full-Stack Developer</title>
    <!-- FontAwesome Icons for Buttons and Tech Badges -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      /* View Credential Buttons */
      .view-credential-btn {
        margin-top: 1.5rem !important;
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        gap: 8px !important;
        padding: 0.65rem 1.4rem !important;
        background: linear-gradient(135deg, #0078d4, #005a9e) !important;
        color: #ffffff !important;
        font-size: 0.95rem !important;
        font-weight: 600 !important;
        text-decoration: none !important;
        border-radius: 30px !important;
        border: 1px solid rgba(255, 255, 255, 0.2) !important;
        box-shadow: 0 4px 15px rgba(0, 120, 212, 0.4) !important;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
      }
      .view-credential-btn:hover {
        transform: translateY(-3px) scale(1.03) !important;
        box-shadow: 0 8px 25px rgba(0, 120, 212, 0.6) !important;
        background: linear-gradient(135deg, #0086ea, #0066b3) !important;
      }
      .view-credential-btn:hover svg {
        transform: translateX(3px) translateY(-1px) !important;
      }
      .view-credential-btn svg {
        transition: transform 0.3s ease !important;
      }

      /* Hero Actions Layout & Secondary Resume CTA Styling */
      .heading-actions {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.2rem;
        margin-top: 2rem;
      }

      .heading-resume-btn {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 0.8rem 2.5rem;
        min-width: 260px;
        background-color: rgba(255, 255, 255, 0.05);
        border: 1.5px solid rgba(255, 255, 255, 0.25);
        border-radius: 4px;
        color: #ffffff;
        font-size: 1.8rem;
        font-weight: 500;
        letter-spacing: 0.5px;
        text-decoration: none;
        cursor: pointer;
        backdrop-filter: blur(8px);
        overflow: hidden;
        transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .heading-resume-btn::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(81, 162, 233, 0.2),
          transparent
        );
        transition: left 0.6s ease;
      }

      .heading-resume-btn:hover {
        transform: translateY(-3px);
        background-color: rgba(255, 255, 255, 0.12);
        border-color: #0078d4;
        color: #ffffff;
        box-shadow: 0 8px 20px rgba(0, 120, 212, 0.35);
      }

      .heading-resume-btn:hover::before {
        left: 100%;
      }

      .heading-resume-btn__icon {
        width: 20px;
        height: 20px;
        stroke: #ffffff;
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), stroke 0.3s ease;
      }

      .heading-resume-btn__external {
        width: 16px;
        height: 16px;
        stroke: rgba(255, 255, 255, 0.7);
        transition: transform 0.3s ease, stroke 0.3s ease, opacity 0.3s ease;
      }

      .heading-resume-btn:hover .heading-resume-btn__icon {
        transform: translateY(-2px) scale(1.1);
        stroke: #51a2e9;
      }

      .heading-resume-btn:hover .heading-resume-btn__external {
        transform: translate(3px, -3px);
        stroke: #51a2e9;
        opacity: 1;
      }

      .heading-resume-btn:active {
        transform: translateY(-1px);
        box-shadow: 0 4px 10px rgba(0, 120, 212, 0.2);
      }

      /* Enhanced Project Info Card Component Styling */
      .project__info {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        max-width: 48rem;
        z-index: 10;
        text-align: left;
      }

      /* 1. Category / Location Pill Badge */
      .project__badge {
        display: inline-flex;
        align-items: center;
        padding: 0.45rem 1.2rem;
        border-radius: 20px;
        background-color: rgba(235, 87, 87, 0.15);
        border: 1px solid rgba(235, 87, 87, 0.4);
        margin-bottom: 1.2rem;
      }

      .project__badge-text {
        font-size: 1.2rem;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: #eb5757;
      }

      /* 2. Title */
      .project__title--enhanced {
        font-size: 3.6rem;
        font-weight: 800;
        line-height: 1.15;
        color: #ffffff;
        margin-bottom: 1.2rem;
        letter-spacing: -0.5px;
      }

      /* 3. Tech Stack Tags */
      .project__tech-stack {
        display: flex;
        flex-wrap: wrap;
        gap: 0.8rem;
        margin-bottom: 1.8rem;
      }

      .tech-tag {
        font-size: 1.25rem;
        font-weight: 600;
        color: #b0c4de;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.15);
        padding: 0.4rem 1rem;
        border-radius: 6px;
        backdrop-filter: blur(4px);
        transition: all 0.25s ease;
      }

      .tech-tag:hover {
        border-color: rgba(255, 255, 255, 0.35);
        background: rgba(255, 255, 255, 0.12);
        color: #ffffff;
      }

      /* 4. Description Body */
      .project__description--enhanced {
        font-size: 1.6rem;
        line-height: 1.6;
        font-weight: 400;
        color: rgba(255, 255, 255, 0.85);
        margin-bottom: 2.2rem;
      }

      /* 5. Action Buttons Grid */
      .project__actions {
        display: flex;
        flex-direction: column;
        gap: 1.2rem;
        width: 100%;
      }
    </style>
  </head>

              <span>View my work</span>

                xmlns="http://www.w3.org/2000/svg"
